version: 2

models:

  - name: int_customers
    tags: ['intermediate', 'cleaning']
    columns:
      - name: customer_id
        data_tests:
          - not_null:
              severity: error
          - unique:
              severity: error
          #     severity: warn
      - name: name
        data_tests:
          - not_null:
              severity: warn
      - name: email
        data_tests:
          - not_null:
              severity: warn
          - valid_email:
              column_name: email
              severity: error
      - name: phone
        data_tests:
          - not_null:
              severity: warn
          - expression_is_true:
              expression: "char_length(phone) = 10"
              severity: error
      - name: loyalty_program_id
        data_tests:
          - not_null:
              severity: warn
          - relationships:
              to: ref('int_loyalty_programs')
              field: loyalty_program_id
              severity: warn
      - name: created_at
        data_tests:
          - expression_is_true:
              expression: "created_at <= current_timestamp"
              severity: error

  - name: int_stores
    tags: ['intermediate', 'cleaning']
    columns:
      - name: store_id
        data_tests:
          - not_null:
              severity: error
          - unique:
              severity: error
          #     severity: warn
      - name: name
        data_tests:
          - not_null:
              severity: warn
      - name: location
        data_tests:
          - not_null:
              severity: warn
      - name: manager_id
        data_tests:
          - not_null:
              severity: warn

  - name: int_employees
    tags: ['intermediate', 'cleaning']
    columns:
      - name: employee_id
        data_tests:
          - not_null:
              severity: error
          - unique:
              severity: error
          #     severity: warn
      - name: name
        data_tests:
          - not_null:
              severity: warn
      - name: role
        data_tests:
          - not_null:
              severity: warn
      - name: store_id
        data_tests:
          - not_null:
              severity: warn
          - relationships:
              to: ref('int_stores')
              field: store_id
              severity: warn

  - name: int_products
    tags: ['intermediate', 'cleaning']
    columns:
      - name: product_id
        data_tests:
          - not_null:
              severity: error
          - unique:
              severity: error
          #     severity: warn
      - name: product_name
        data_tests:
          - not_null:
              severity: warn
      - name: category_id
        data_tests:
          - not_null:
              severity: warn
          - relationships:
              to: ref('int_categories')
              field: category_id
              severity: warn
      - name: brand_id
        data_tests:
          - not_null:
              severity: warn
          - relationships:
              to: ref('int_brands')
              field: brand_id
              severity: warn
      - name: supplier_id
        data_tests:
          - not_null:
              severity: warn
          - relationships:
              to: ref('int_suppliers')
              field: supplier_id
              severity: warn
      - name: price
        data_tests:
          - not_null:
              severity: warn
          - expression_is_true:
              expression: "price >= 0"
              severity: warn
      - name: created_at
        data_tests:
          - not_null:
              severity: warn
          - expression_is_true:
              expression: "created_at <= current_timestamp"
              severity: error
      - name: season
        data_tests:
          - not_null:
              severity: warn
          - accepted_values:
              values: ['Spring', 'Summer', 'Autumn', 'Winter', 'All Year']
              severity: error

  - name: int_categories
    tags: ['intermediate', 'cleaning']
    columns:
      - name: category_id
        data_tests:
          - not_null:
              severity: error
          - unique:
              severity: error
